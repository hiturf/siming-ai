# One-shot repair workflow; the generated repair branch removes this file.
name: One-shot OpenAPI type regeneration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-openapi-sync.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate and verify OpenAPI types
        working-directory: frontend
        run: |
          npm run api:generate
          npm run api:check

      - name: Commit the generated file on a repair branch
        env:
          BRANCH_NAME: fix/sync-generated-openapi-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git rm .github/workflows/one-shot-openapi-sync.yml
          git add frontend/src/api/generated/schema.d.ts
          if git diff --cached --quiet; then
            echo "OpenAPI generation produced no repository change." >&2
            exit 1
          fi
          git commit -m "chore(api): sync generated OpenAPI types"
          git push origin "HEAD:$BRANCH_NAME"
          echo "Generated repair branch: $BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
