name: Apply Android TXT import performance and encoding fix

on:
  push:
    branches:
      - fix/android-txt-import-performance-encoding

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-txt-import-performance-encoding
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply source changes
        run: python .github/scripts/apply_android_import_fix.py

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend import regressions
        working-directory: backend
        run: |
          pytest -q tests/test_importer.py tests/test_android_canonical_routes.py
          ruff check app/services/import_service.py app/routers/importer.py app/bootstrap/http_security.py tests/test_importer.py

      - name: Run Android import unit tests and compile app
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests com.siming.mobile.data.NovelImportTest --stacktrace

      - name: Validate patch
        run: |
          git diff --check
          git status --short

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend mobile/android
          git commit -m "修复 Android TXT 编码与批量导入性能"
          git push origin HEAD:fix/android-txt-import-performance-encoding
