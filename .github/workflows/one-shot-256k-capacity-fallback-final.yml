name: One-shot 256K capacity fallback final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-256k-capacity-fallback-final.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply product patch and synchronize contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_workflow = Path(".github/workflows/one-shot-256k-capacity-fallback.yml")
          workflow = source_workflow.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          script = script.replace(
              "'        \"unverified\" ->",
              "'    \"unverified\" ->",
          )
          exec(compile(script, "one-shot-256k-capacity-fallback.py", "exec"), {"__name__": "__main__"})

          test_path = Path(
              "mobile/android/app/src/test/java/com/siming/mobile/ui/ReferenceAssistantWorkspaceTest.kt"
          )
          text = test_path.read_text(encoding="utf-8")
          for import_line in (
              "import com.siming.mobile.data.mobileAssistantContextFailureEvent\n",
              "import com.siming.mobile.data.agent.MobileConversationContextErrorCode\n",
              "import com.siming.mobile.data.agent.MobileConversationContextException\n",
              "import kotlinx.serialization.json.JsonObject\n",
          ):
              text = text.replace(import_line, "")
          pattern = re.compile(
              r"    @Test\n"
              r"    fun `assistant task model override emits typed capacity event for configuration action`\(\) \{.*?"
              r"\n    \}\n\n"
              r"(?=    private fun replica)",
              re.S,
          )
          replacement = (
              "    @Test\n"
              "    fun `assistant task model override uses bounded 256k fallback`() {\n"
              "        val config = DirectApiConfig(\n"
              "            displayName = \"test\",\n"
              "            baseUrl = \"https://example.test/v1\",\n"
              "            apiKey = \"secret\",\n"
              "            model = \"general-model\",\n"
              "            taskModels = mapOf(DirectApiConfig.TASK_ASSISTANT to \"assistant-model\"),\n"
              "            contextWindowTokens = 128_000,\n"
              "        )\n\n"
              "        val resolved = mobileCapacityBoundTaskConfig(config, DirectApiConfig.TASK_ASSISTANT)\n\n"
              "        assertEquals(\"assistant-model\", resolved.model)\n"
              "        assertEquals(DirectApiConfig.DEFAULT_CONTEXT_WINDOW_TOKENS, resolved.contextWindowTokens)\n"
              "        assertEquals(DirectApiConfig.DEFAULT_AGENT_OUTPUT_TOKENS, resolved.maxOutputTokens)\n"
              "        assertEquals(128_000, config.contextWindowTokens)\n"
              "    }\n\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(
                  "ReferenceAssistantWorkspaceTest.kt: stale capacity test could not be replaced"
              )
          test_path.write_text(text, encoding="utf-8")

          orchestrator_path = Path("backend/app/services/context_orchestrator.py")
          orchestrator = orchestrator_path.read_text(encoding="utf-8")
          verbose_capacity = '''        fallback_window = (
            DEFAULT_LOCAL_CONTEXT_WINDOW_TOKENS
            if provider == "local_llama_cpp"
            else DEFAULT_CONTEXT_WINDOW_TOKENS
        )
        fallback_output = min(
            output_limit(),
            max(1, fallback_window // 4),
            max(1, fallback_window - DEFAULT_SAFETY_MARGIN_TOKENS - 1),
        )'''
          compact_capacity = '''        fallback_window = DEFAULT_CONTEXT_WINDOW_TOKENS
        if provider == "local_llama_cpp":
            fallback_window = DEFAULT_LOCAL_CONTEXT_WINDOW_TOKENS
        fallback_output = min(
            output_limit(), max(1, fallback_window // 4),
            max(1, fallback_window - DEFAULT_SAFETY_MARGIN_TOKENS - 1),
        )'''
          if orchestrator.count(verbose_capacity) != 1:
              raise SystemExit("context_orchestrator.py: capacity block did not match once")
          orchestrator = orchestrator.replace(verbose_capacity, compact_capacity, 1)
          verbose_warning = '''                warnings.append(
                    "No exact model context profile is configured; "
                    "the temporary 256K fallback was used. "
                    "Configure the exact provider/model limit when available."
                )'''
          compact_warning = '''                warnings.append(
                    "No exact model context profile is configured; the temporary 256K "
                    "fallback was used. Configure the exact provider/model limit when available.")'''
          if orchestrator.count(verbose_warning) != 1:
              raise SystemExit("context_orchestrator.py: fallback warning did not match once")
          orchestrator_path.write_text(
              orchestrator.replace(verbose_warning, compact_warning, 1),
              encoding="utf-8",
          )
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Regenerate and validate Android context policy
        run: |
          python scripts/export-mobile-context-policy.py
          python scripts/export-mobile-context-policy.py --check

      - name: Validate backend architecture and focused behavior
        run: |
          cd backend
          python scripts/run_quality.py
          python -m pytest \
            tests/test_conversation_context_budget.py \
            tests/test_conversation_context_runtime.py \
            tests/test_context_orchestrator.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Run all Android unit tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest

      - name: Commit the verified repair on a normal branch
        env:
          BRANCH_NAME: fix/default-256k-capacity-fallback-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git rm \
            .github/workflows/one-shot-256k-capacity-fallback.yml \
            .github/workflows/one-shot-256k-capacity-fallback-rerun.yml \
            .github/workflows/one-shot-256k-capacity-fallback-final.yml
          git add -A
          git diff --cached --check
          echo "Changed paths:"
          git diff --cached --name-status
          git commit -m "fix(context): use bounded 256K capacity fallback"
          git push origin "HEAD:$BRANCH_NAME"
          echo "Generated repair branch: $BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
