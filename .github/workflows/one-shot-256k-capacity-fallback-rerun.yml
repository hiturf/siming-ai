name: One-shot 256K capacity fallback repair rerun

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-256k-capacity-fallback-rerun.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply bounded 256K capacity fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/one-shot-256k-capacity-fallback.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          script = script.replace(
              "'        \"unverified\" ->",
              "'    \"unverified\" ->",
          )
          exec(compile(script, "one-shot-256k-capacity-fallback.py", "exec"), {"__name__": "__main__"})
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run focused backend tests
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_conversation_context_budget.py \
            tests/test_conversation_context_runtime.py \
            tests/test_context_orchestrator.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Run Android unit tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest

      - name: Commit the repair on a branch
        env:
          BRANCH_NAME: fix/default-256k-capacity-fallback-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git rm \
            .github/workflows/one-shot-256k-capacity-fallback.yml \
            .github/workflows/one-shot-256k-capacity-fallback-rerun.yml
          git add \
            backend/app/core/model_limits.py \
            backend/app/services/conversation_context/budget.py \
            backend/app/services/conversation_context/assembly.py \
            backend/app/services/conversation_context/__init__.py \
            backend/app/services/context_orchestrator.py \
            backend/app/modules/context/infrastructure/governance.py \
            frontend/src/components/assistant/ConversationCheckpointNotice.tsx \
            backend/tests/test_context_orchestrator.py \
            backend/tests/test_conversation_context_budget.py \
            backend/tests/test_conversation_context_runtime.py \
            mobile/android/app/src/main/java/com/siming/mobile/data/network/DirectApi.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/agent/MobileConversationBudget.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/agent/MobileDirectConversationContextRuntime.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/SimingRepository.kt \
            mobile/android/app/src/main/java/com/siming/mobile/security/MobileProviderEncryption.kt \
            mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt \
            mobile/android/app/src/main/java/com/siming/mobile/ui/AssistantWorkspace.kt \
            mobile/android/app/src/test/java/com/siming/mobile/data/network/DirectApiClientTest.kt \
            mobile/android/app/src/test/java/com/siming/mobile/data/agent/MobileConversationContextTest.kt \
            mobile/android/app/src/test/java/com/siming/mobile/security/MobileProviderEncryptionContractTest.kt
          git diff --cached --check
          git commit -m "fix(context): use bounded 256K capacity fallback"
          git push origin "HEAD:$BRANCH_NAME"
          echo "Generated repair branch: $BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
