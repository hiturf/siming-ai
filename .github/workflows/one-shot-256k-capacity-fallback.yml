      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run focused backend tests
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_conversation_context_budget.py \
            tests/test_conversation_context_runtime.py \
            tests/test_context_orchestrator.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Run Android unit tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest

      - name: Commit the repair on a branch
        env:
          BRANCH_NAME: fix/default-256k-capacity-fallback-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git rm .github/workflows/one-shot-256k-capacity-fallback.yml
          git add \
            backend/app/core/model_limits.py \
            backend/app/services/conversation_context/budget.py \
            backend/app/services/conversation_context/assembly.py \
            backend/app/services/conversation_context/__init__.py \
            backend/app/services/context_orchestrator.py \
            backend/app/modules/context/infrastructure/governance.py \
            frontend/src/components/assistant/ConversationCheckpointNotice.tsx \
            backend/tests/test_context_orchestrator.py \
            backend/tests/test_conversation_context_budget.py \
            backend/tests/test_conversation_context_runtime.py \
            mobile/android/app/src/main/java/com/siming/mobile/data/network/DirectApi.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/agent/MobileConversationBudget.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/agent/MobileDirectConversationContextRuntime.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/SimingRepository.kt \
            mobile/android/app/src/main/java/com/siming/mobile/security/MobileProviderEncryption.kt \
            mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt \
            mobile/android/app/src/main/java/com/siming/mobile/ui/AssistantWorkspace.kt \
