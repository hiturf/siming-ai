name: One-shot 256K capacity fallback repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-256k-capacity-fallback.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply bounded 256K capacity fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:120]!r}")
              write(path, value.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str, *, flags: int = 0) -> None:
              value = read(path)
              updated, count = re.subn(pattern, replacement, value, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:120]!r}")
              write(path, updated)

          replace_once(
              "backend/app/core/model_limits.py",
              "DEFAULT_MODEL_CONTEXT_WINDOW_TOKENS = 1_000_000",
              "DEFAULT_MODEL_CONTEXT_WINDOW_TOKENS = 256_000",
          )

          path = "backend/app/services/conversation_context/budget.py"
          replace_once(
              path,
              "from typing import Any, Protocol, runtime_checkable\n\nfrom ..rag.context_packer import estimate_tokens",
              "from typing import Any, Protocol, runtime_checkable\n\nfrom ...core.model_limits import DEFAULT_MODEL_CONTEXT_WINDOW_TOKENS\nfrom ..rag.context_packer import estimate_tokens",
          )
          replace_once(
              path,
              "@dataclass(frozen=True)\n"
              "class UnverifiedEstimateTokenCounter:\n"
              "    \"\"\"Existing RAG estimator exposed honestly for preview/telemetry only.\"\"\"\n\n"
              "    counter_id: str = \"legacy.rag_estimate.v1\"\n"
              "    assurance: CapacityAssurance = CapacityAssurance.UNVERIFIED\n\n"
              "    def count_text(self, text: str) -> int:\n"
              "        return estimate_tokens(str(text or \"\"))\n\n"
              "    def count_value(self, value: Any) -> int:\n"
              "        return self.count_text(canonical_json(value))\n\n\n"
              "@dataclass(frozen=True)\n"
              "class Utf8ByteTokenCounter:",
              "@dataclass(frozen=True)\n"
              "class UnverifiedEstimateTokenCounter:\n"
              "    \"\"\"Existing RAG estimator exposed honestly for preview/telemetry only.\"\"\"\n\n"
              "    counter_id: str = \"legacy.rag_estimate.v1\"\n"
              "    assurance: CapacityAssurance = CapacityAssurance.UNVERIFIED\n\n"
              "    def count_text(self, text: str) -> int:\n"
              "        return estimate_tokens(str(text or \"\"))\n\n"
              "    def count_value(self, value: Any) -> int:\n"
              "        return self.count_text(canonical_json(value))\n\n\n"
              "FALLBACK_UTF8_BYTE_TOKEN_COUNTER_ID = \"fallback.utf8_bytes.v1\"\n\n\n"
              "@dataclass(frozen=True)\n"
              "class FallbackUtf8ByteTokenCounter:\n"
              "    \"\"\"Conservative byte count paired with the bounded unverified fallback window.\"\"\"\n\n"
              "    counter_id: str = FALLBACK_UTF8_BYTE_TOKEN_COUNTER_ID\n"
              "    assurance: CapacityAssurance = CapacityAssurance.UNVERIFIED\n\n"
              "    def count_text(self, text: str) -> int:\n"
              "        return len(str(text or \"\").encode(\"utf-8\"))\n\n"
              "    def count_value(self, value: Any) -> int:\n"
              "        return self.count_text(canonical_json(value))\n\n\n"
              "@dataclass(frozen=True)\n"
              "class Utf8ByteTokenCounter:",
          )
          replace_once(
              path,
              "    @property\n"
              "    def verified(self) -> bool:\n"
              "        return self.capacity_assurance in {\n"
              "            CapacityAssurance.EXACT,\n"
              "            CapacityAssurance.CONSERVATIVE,\n"
              "        }\n\n"
              "    def to_dict(self) -> dict[str, Any]:\n"
              "        return canonical_value(self)\n\n"
              "    def require_sendable(self) -> None:\n"
              "        if not self.verified:\n",
              "    @property\n"
              "    def verified(self) -> bool:\n"
              "        return self.capacity_assurance in {\n"
              "            CapacityAssurance.EXACT,\n"
              "            CapacityAssurance.CONSERVATIVE,\n"
              "        }\n\n"
              "    @property\n"
              "    def bounded_fallback(self) -> bool:\n"
              "        return (\n"
              "            self.capacity_assurance is CapacityAssurance.UNVERIFIED\n"
              "            and self.token_counter_id == FALLBACK_UTF8_BYTE_TOKEN_COUNTER_ID\n"
              "            and 0 < self.context_window_tokens <= DEFAULT_MODEL_CONTEXT_WINDOW_TOKENS\n"
              "        )\n\n"
              "    def to_dict(self) -> dict[str, Any]:\n"
              "        return canonical_value(self)\n\n"
              "    def require_sendable(self) -> None:\n"
              "        if not self.verified and not self.bounded_fallback:\n",
          )
          replace_once(
              path,
              "__all__ = [\n"
              "    \"CallableTokenCounter\",",
              "__all__ = [\n"
              "    \"CallableTokenCounter\",\n"
              "    \"FallbackUtf8ByteTokenCounter\",",
          )

          path = "backend/app/services/conversation_context/assembly.py"
          replace_once(
              path,
              "    RequestBudgetEnvelope,\n"
              "    RequestTokenComponents,\n"
              "    TokenCounter,\n"
              "    UnverifiedEstimateTokenCounter,\n"
              "    Utf8ByteTokenCounter,",
              "    FallbackUtf8ByteTokenCounter,\n"
              "    RequestBudgetEnvelope,\n"
              "    RequestTokenComponents,\n"
              "    TokenCounter,\n"
              "    Utf8ByteTokenCounter,",
          )
          replace_once(
              path,
              "    \"\"\"Adapt the one authoritative model profile; never guess unknown capacity.\"\"\"",
              "    \"\"\"Adapt the model profile, using the bounded 256K fallback when it is unknown.\"\"\"",
          )
          replace_once(
              path,
              "    else:\n"
              "        counter = UnverifiedEstimateTokenCounter()\n"
              "        assurance = CapacityAssurance.UNVERIFIED",
              "    else:\n"
              "        counter = FallbackUtf8ByteTokenCounter()\n"
              "        assurance = CapacityAssurance.UNVERIFIED",
          )

          path = "backend/app/services/conversation_context/__init__.py"
          replace_once(
              path,
              "from .budget import (\n"
              "    CallableTokenCounter,\n"
              "    RequestBudgetEnvelope,",
              "from .budget import (\n"
              "    CallableTokenCounter,\n"
              "    FallbackUtf8ByteTokenCounter,\n"
              "    RequestBudgetEnvelope,",
          )
          replace_once(
              path,
              "    \"ExecutionLedgerEntry\",\n"
              "    \"GenerationModelBinding\",",
              "    \"ExecutionLedgerEntry\",\n"
              "    \"FallbackUtf8ByteTokenCounter\",\n"
              "    \"GenerationModelBinding\",",
          )

          path = "backend/app/services/context_orchestrator.py"
          replace_once(
              path,
              "        return ResolvedModelContextProfile(\n"
              "            provider=provider,\n"
              "            model_name=model_name,\n"
              "            context_window_tokens=(\n"
              "                DEFAULT_LOCAL_CONTEXT_WINDOW_TOKENS\n"
              "                if provider == \"local_llama_cpp\"\n"
              "                else DEFAULT_CONTEXT_WINDOW_TOKENS\n"
              "            ),\n"
              "            max_output_tokens=output_limit(),\n"
              "            safety_margin_tokens=DEFAULT_SAFETY_MARGIN_TOKENS,\n"
              "            known=False,\n"
              "        )",
              "        fallback_window = (\n"
              "            DEFAULT_LOCAL_CONTEXT_WINDOW_TOKENS\n"
              "            if provider == \"local_llama_cpp\"\n"
              "            else DEFAULT_CONTEXT_WINDOW_TOKENS\n"
              "        )\n"
              "        fallback_output = min(\n"
              "            output_limit(),\n"
              "            max(1, fallback_window // 4),\n"
              "            max(1, fallback_window - DEFAULT_SAFETY_MARGIN_TOKENS - 1),\n"
              "        )\n"
              "        return ResolvedModelContextProfile(\n"
              "            provider=provider,\n"
              "            model_name=model_name,\n"
              "            context_window_tokens=fallback_window,\n"
              "            max_output_tokens=fallback_output,\n"
              "            safety_margin_tokens=DEFAULT_SAFETY_MARGIN_TOKENS,\n"
              "            known=False,\n"
              "        )",
          )
          replace_once(
              path,
              "                    \"No exact model context profile is configured; \"\n"
              "                    \"the platform 1M context default was used. \"\n"
              "                    \"Configure a profile when the provider exposes a lower limit.\"",
              "                    \"No exact model context profile is configured; \"\n"
              "                    \"the temporary 256K fallback was used. \"\n"
              "                    \"Configure the exact provider/model limit when available.\"",
          )

          path = "backend/app/modules/context/infrastructure/governance.py"
          replace_once(
              path,
              "                \"sendable_for_hard_budget\": False,\n"
              "                \"reason\": (\n"
              "                    \"The platform 1M value is an unverified preview estimate only. \"\n"
              "                    \"Agent requests that require a hard capacity guarantee need an enabled \"\n"
              "                    \"provider/model profile.\"\n"
              "                ),",
              "                \"sendable_for_hard_budget\": True,\n"
              "                \"reason\": (\n"
              "                    \"No exact capacity profile is configured. Siming temporarily binds a \"\n"
              "                    \"256K window, counts the full request with a conservative byte bound, \"\n"
              "                    \"and lets an exact provider/model profile override it.\"\n"
              "                ),",
          )

          replace_once(
              "frontend/src/components/assistant/ConversationCheckpointNotice.tsx",
              "  unverified: '未验证（不会继续执行当前任务）',",
              "  unverified: '未验证容量（已启用安全兜底窗口）',",
          )

          path = "backend/tests/test_context_orchestrator.py"
          replace_once(
              path,
              "    def test_unknown_remote_model_uses_large_platform_window_and_hard_budget(self):",
              "    def test_unknown_remote_model_uses_256k_fallback_and_hard_budget(self):",
          )
          replace_once(path, "        self.assertEqual(manifest.context_window_tokens, 1_000_000)", "        self.assertEqual(manifest.context_window_tokens, 256_000)")
          replace_once(
              path,
              "        self.assertTrue(any(\"platform 1M context default\" in warning for warning in manifest.warnings_json))",
              "        self.assertTrue(any(\"temporary 256K fallback\" in warning for warning in manifest.warnings_json))",
          )

          path = "backend/tests/test_conversation_context_budget.py"
          replace_once(
              path,
              "    ConversationContextErrorCode,\n"
              "    GenerationModelBinding,",
              "    ConversationContextErrorCode,\n"
              "    FallbackUtf8ByteTokenCounter,\n"
              "    GenerationModelBinding,",
          )
          replace_once(
              path,
              "def test_budget_rejects_counter_that_does_not_match_binding() -> None:",
              "def test_bounded_256k_fallback_is_sendable_without_becoming_verified() -> None:\n"
              "    counter = FallbackUtf8ByteTokenCounter()\n"
              "    binding = _binding(\n"
              "        assurance=CapacityAssurance.UNVERIFIED,\n"
              "        counter_id=counter.counter_id,\n"
              "        context_window=256_000,\n"
              "        max_output=16_000,\n"
              "    )\n"
              "    budget = build_request_budget(\n"
              "        binding=binding,\n"
              "        counter=counter,\n"
              "        components=RequestTokenComponents(current_user_tokens=10),\n"
              "        safety_margin_tokens=512,\n"
              "    )\n\n"
              "    assert budget.verified is False\n"
              "    assert budget.bounded_fallback is True\n"
              "    budget.require_sendable()\n\n\n"
              "def test_budget_rejects_counter_that_does_not_match_binding() -> None:",
          )

          path = "backend/tests/test_conversation_context_runtime.py"
          replace_once(
              path,
              "def test_unknown_profile_is_unverified_and_cannot_send() -> None:\n"
              "    binding, counter, _ = resolve_generation_model_binding(\n"
              "        orchestrator=_Orchestrator(known=False),\n"
              "        model=\"custom:test\",\n"
              "        task_type=\"assistant\",\n"
              "        protocol=\"chat_completions\",\n"
              "        system_prompt=\"system\",\n"
              "        current_tools=(),\n"
              "    )\n"
              "    assert binding.capacity_assurance is CapacityAssurance.UNVERIFIED\n"
              "    budget = build_request_budget(\n"
              "        binding=binding,\n"
              "        counter=counter,\n"
              "        components=RequestTokenComponents(current_user_tokens=1),\n"
              "        safety_margin_tokens=0,\n"
              "    )\n"
              "    with pytest.raises(ConversationContextError) as caught:\n"
              "        budget.require_sendable()\n"
              "    assert caught.value.code is ConversationContextErrorCode.CAPACITY_UNKNOWN\n",
              "def test_unknown_profile_uses_bounded_fallback_and_can_send() -> None:\n"
              "    binding, counter, _ = resolve_generation_model_binding(\n"
              "        orchestrator=_Orchestrator(known=False, window=256_000),\n"
              "        model=\"custom:test\",\n"
              "        task_type=\"assistant\",\n"
              "        protocol=\"chat_completions\",\n"
              "        system_prompt=\"system\",\n"
              "        current_tools=(),\n"
              "    )\n"
              "    assert binding.capacity_assurance is CapacityAssurance.UNVERIFIED\n"
              "    assert counter.counter_id == \"fallback.utf8_bytes.v1\"\n"
              "    budget = build_request_budget(\n"
              "        binding=binding,\n"
              "        counter=counter,\n"
              "        components=RequestTokenComponents(current_user_tokens=1),\n"
              "        safety_margin_tokens=0,\n"
              "    )\n"
              "    assert budget.bounded_fallback is True\n"
              "    budget.require_sendable()\n",
          )

          path = "mobile/android/app/src/main/java/com/siming/mobile/data/network/DirectApi.kt"
          regex_once(
              path,
              r'internal class DirectApiTaskCapacityUnknownException\(\n'
              r'    val taskType: String,\n'
              r'    val selectedModel: String,\n'
              r'\) : IllegalStateException\("任务 \$taskType 的模型 \$selectedModel 未配置独立容量档案"\)\n\n',
              "",
          )
          replace_once(
              path,
              "    /** Explicit author-supplied capacity profile; never inferred from model_name. */\n"
              "    val contextWindowTokens: Int? = null,",
              "    /** Author-supplied capacity; null temporarily uses the bounded 256K fallback. */\n"
              "    val contextWindowTokens: Int? = null,",
          )
          replace_once(
              path,
              "    /**\n"
              "     * A capacity profile belongs to the configured default model. Until Android\n"
              "     * stores per-task profiles, selecting a different task model must fail closed\n"
              "     * instead of presenting the default model's capacity as known.\n"
              "     */\n"
              "    fun forTask(taskType: String): DirectApiConfig {\n"
              "        val configuredDefaultModel = model.trim()\n"
              "        val selectedModel = modelForTask(taskType).trim()\n"
              "        if (selectedModel != configuredDefaultModel) {\n"
              "            throw DirectApiTaskCapacityUnknownException(taskType, selectedModel)\n"
              "        }\n"
              "        return copy(model = selectedModel)\n"
              "    }\n",
              "    fun withContextWindowFallback(): DirectApiConfig {\n"
              "        if (contextWindowTokens != null) return this\n"
              "        val outputLimit = DEFAULT_CONTEXT_WINDOW_TOKENS - safetyMarginTokens - 1\n"
              "        require(outputLimit > 0) { \"256K 兜底窗口无法为输入保留空间\" }\n"
              "        return copy(\n"
              "            contextWindowTokens = DEFAULT_CONTEXT_WINDOW_TOKENS,\n"
              "            maxOutputTokens = minOf(maxOutputTokens, outputLimit),\n"
              "        )\n"
              "    }\n\n"
              "    /**\n"
              "     * Preserve an explicit profile, use exact first-party metadata when available,\n"
              "     * otherwise bind the selected task model to the shared 256K fallback.\n"
              "     */\n"
              "    fun forTask(taskType: String): DirectApiConfig {\n"
              "        val defaultModel = MobileKnownModelCapacityCatalog.canonicalModelForOfficialEndpoint(\n"
              "            baseUrl,\n"
              "            model,\n"
              "        )\n"
              "        val selectedModel = MobileKnownModelCapacityCatalog.canonicalModelForOfficialEndpoint(\n"
              "            baseUrl,\n"
              "            modelForTask(taskType),\n"
              "        )\n"
              "        val selected = if (selectedModel == defaultModel) {\n"
              "            copy(model = selectedModel)\n"
              "        } else {\n"
              "            copy(model = selectedModel, contextWindowTokens = null)\n"
              "        }\n"
              "        val bound = if (selected.contextWindowTokens != null) {\n"
              "            selected\n"
              "        } else {\n"
              "            MobileKnownModelCapacityCatalog.applyIfKnown(selected)\n"
              "        }\n"
              "        return (bound ?: selected).withContextWindowFallback()\n"
              "    }\n",
          )
          replace_once(
              path,
              "        const val DEFAULT_AGENT_OUTPUT_TOKENS = 6_000",
              "        const val DEFAULT_CONTEXT_WINDOW_TOKENS = 256_000\n"
              "        const val DEFAULT_AGENT_OUTPUT_TOKENS = 6_000",
          )

          path = "mobile/android/app/src/main/java/com/siming/mobile/data/agent/MobileConversationBudget.kt"
          replace_once(
              path,
              "import com.siming.mobile.data.network.MobileKnownModelCapacityCatalog\n",
              "",
          )
          regex_once(
              path,
              r'/\*\* Resolves a task model only from an author profile or an exact first-party fact\. \*/\n'
              r'internal fun mobileCapacityBoundTaskConfig\(\n'
              r'    config: DirectApiConfig,\n'
              r'    taskType: String,\n'
              r'\): DirectApiConfig \{.*?\n\}\n\n',
              "/** Resolve every task model through DirectApiConfig's single capacity path. */\n"
              "internal fun mobileCapacityBoundTaskConfig(\n"
              "    config: DirectApiConfig,\n"
              "    taskType: String,\n"
              "): DirectApiConfig = config.forTask(taskType)\n\n",
              flags=re.S,
          )

          path = "mobile/android/app/src/main/java/com/siming/mobile/data/agent/MobileDirectConversationContextRuntime.kt"
          replace_once(
              path,
              "        val contextWindow = config.contextWindowTokens ?: throw MobileConversationContextException(\n"
              "            MobileConversationContextErrorCode.CAPACITY_UNKNOWN,\n"
              "            \"手机直连 Agent 模型尚未配置上下文窗口，未执行任何业务工具\",\n"
              "        )\n"
              "        val counter = MobileUtf8ByteTokenCounter",
              "        val effectiveConfig = config.withContextWindowFallback()\n"
              "        val contextWindow = requireNotNull(effectiveConfig.contextWindowTokens)\n"
              "        val counter = MobileUtf8ByteTokenCounter",
          )
          value = read(path)
          start = value.index("    suspend fun prepare(")
          end = value.index("    private fun largestCheckpointPrefix(", start)
          segment = value[start:end]
          segment = segment.replace("config = config,", "config = effectiveConfig,")
          segment = segment.replace("config.model.trim()", "effectiveConfig.model.trim()")
          segment = segment.replace("config.protocol", "effectiveConfig.protocol")
          segment = segment.replace("config.baseUrl", "effectiveConfig.baseUrl")
          segment = segment.replace("config.safetyMarginTokens", "effectiveConfig.safetyMarginTokens")
          value = value[:start] + segment + value[end:]
          write(path, value)

          path = "mobile/android/app/src/main/java/com/siming/mobile/data/SimingRepository.kt"
          regex_once(
              path,
              r'    private fun requireMobileProviderCapacity\(config: DirectApiConfig\): DirectApiConfig \{.*?'
              r'        return config\n'
              r'    \}',
              "    private fun requireMobileProviderCapacity(config: DirectApiConfig): DirectApiConfig =\n"
              "        config.withContextWindowFallback()",
              flags=re.S,
          )

          path = "mobile/android/app/src/main/java/com/siming/mobile/security/MobileProviderEncryption.kt"
          replace_once(
              path,
              "        val contextWindow = requireNotNull(config.contextWindowTokens) {\n"
              "            \"手机模型线路尚未配置上下文窗口，未创建 Gateway 凭据密文\"\n"
              "        }\n"
              "        return buildJsonObject {",
              "        val effectiveConfig = config.withContextWindowFallback()\n"
              "        val contextWindow = requireNotNull(effectiveConfig.contextWindowTokens)\n"
              "        return buildJsonObject {",
          )
          value = read(path)
          start = value.index("    internal fun providerPlaintext(")
          end = value.index("    private fun hkdfSha256(", start)
          segment = value[start:end]
          segment = segment.replace("config.baseUrl", "effectiveConfig.baseUrl")
          segment = segment.replace("config.apiKey", "effectiveConfig.apiKey")
          segment = segment.replace("config.model", "effectiveConfig.model")
          segment = segment.replace("config.protocol", "effectiveConfig.protocol")
          segment = segment.replace("config.maxOutputTokens", "effectiveConfig.maxOutputTokens")
          segment = segment.replace("config.safetyMarginTokens", "effectiveConfig.safetyMarginTokens")
          value = value[:start] + segment + value[end:]
          write(path, value)

          path = "mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt"
          replace_once(
              path,
              "        mutableStateOf(existing?.contextWindowTokens?.toString().orEmpty())",
              "        mutableStateOf((existing?.contextWindowTokens ?: DirectApiConfig.DEFAULT_CONTEXT_WINDOW_TOKENS).toString())",
          )
          replace_once(
              path,
              "            contextWindowTokens = \"\"\n"
              "            maxOutputTokens = DirectApiConfig.DEFAULT_AGENT_OUTPUT_TOKENS.toString()",
              "            contextWindowTokens = DirectApiConfig.DEFAULT_CONTEXT_WINDOW_TOKENS.toString()\n"
              "            maxOutputTokens = DirectApiConfig.DEFAULT_AGENT_OUTPUT_TOKENS.toString()",
          )
          replace_once(
              path,
              "                    \"容量必须来自模型服务商文档或你的部署配置；司命不会根据模型名猜测。UTF-8 保守计数只会低估可用空间，不会把未知容量伪装成安全。\"",
              "                    \"未取得官方或作者配置时，司命临时按 256K 上下文兜底，并继续使用 UTF-8 保守计数；服务商实际窗口更小时请按文档修改。\"",
          )
          replace_once(path, '                placeholder = { Text("例如 128000") },', '                placeholder = { Text("例如 256000") },')
          replace_once(
              path,
              "                            \"必填；留空时手机直连 Agent 会明确停止，不裁剪历史继续执行\"",
              "                            \"未取得官方容量时默认按 256000 兜底；可按服务商实际窗口调整\"",
          )

          path = "mobile/android/app/src/main/java/com/siming/mobile/ui/AssistantWorkspace.kt"
          replace_once(
              path,
              '        "unverified" -> "未验证（当前任务不会继续）"',
              '        "unverified" -> "未验证容量（已启用安全兜底窗口）"',
          )

          path = "mobile/android/app/src/test/java/com/siming/mobile/data/network/DirectApiClientTest.kt"
          replace_once(
              path,
              "    fun `task model without its own capacity profile fails closed`() {\n"
              "        val config = DirectApiConfig(\n"
              "            displayName = \"test\",\n"
