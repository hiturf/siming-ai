name: Finalize Android TXT import fix

on:
  push:
    branches:
      - fix/android-txt-import-performance-encoding

permissions:
  contents: write

jobs:
  harden-test-generate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-txt-import-performance-encoding
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply final source hardening
        run: python .github/scripts/finalize_android_import_fix.py

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format and test backend import flow
        working-directory: backend
        run: |
          ruff check --fix --select I,F app/services/import_service.py tests/test_importer.py
          pytest -q tests/test_importer.py tests/test_android_canonical_routes.py
          ruff check --select I,F app/services/import_service.py app/routers/importer.py app/bootstrap/http_security.py tests/test_importer.py

      - name: Test Android import decoder and splitter
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests com.siming.mobile.data.NovelImportTest --stacktrace

      - name: Regenerate and verify OpenAPI types
        working-directory: frontend
        run: |
          npm run api:generate
          npm run api:check

      - name: Validate diff
        run: git diff --check

      - name: Commit final source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend mobile/android frontend/src/api/generated/schema.d.ts
          git commit -m "完善 Android TXT 批量导入与章节识别"
          git fetch origin fix/android-txt-import-performance-encoding
          git rebase origin/fix/android-txt-import-performance-encoding
          git push origin HEAD:fix/android-txt-import-performance-encoding
